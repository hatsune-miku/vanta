<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>资源署名 · VANTA</title>
    <style>
      .credits-body {
        margin: 0;
        background: #080e18;
        color: #d7e6f0;
        font:
          16px/1.8 system-ui,
          sans-serif;
      }
      .credits {
        display: flex;
        flex-direction: column;
        gap: 24px;
        max-width: 720px;
        margin: 8vh auto;
        padding: 24px;
      }
      .credits-title {
        margin: 0;
        color: white;
        font-size: 32px;
      }
      .credits-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .credits-heading {
        margin: 0;
        font-size: 22px;
      }
      .credits-text {
        margin: 0;
      }
      .credits-link {
        color: #73d5ff;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body class="credits-body">
    <main class="credits">
      <h1 class="credits-title">VANTA · 资源署名</h1>
      <section class="credits-section">
        <h2 class="credits-heading">Elle — Sci-Fi Anime Girl</h2>
        <p class="credits-text">
          主角模型由 <a class="credits-link" href="https://sketchfab.com/kaisamafab">Kai Sama</a> 制作， 来自
          <a
            class="credits-link"
            href="https://sketchfab.com/3d-models/elle-sci-fi-anime-girl-e16bf07a62e54b8ea99ca2653675bb41"
            >Sketchfab</a
          >， 采用 <a class="credits-link" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> 授权。
        </p>
        <p class="credits-text">
          VANTA 调整了模型尺寸和原点、骨骼与贴图资源、银白发及青蓝材质，改编了战斗动作与姿态并添加武器。
        </p>
      </section>
      <section class="credits-section">
        <h2 class="credits-heading">Quaternius</h2>
        <p class="credits-text">
          敌人基础模型与 Universal Animation Library 动作库由
          <a class="credits-link" href="https://quaternius.com/">Quaternius</a> 制作，采用
          <a class="credits-link" href="https://creativecommons.org/publicdomain/zero/1.0/">CC0 1.0</a> 授权。
        </p>
      </section>
      <a class="credits-link" href="./">返回 VANTA</a>
    </main>
  </body>
</html>
